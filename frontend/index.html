<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1c2738" />
    <meta name="description"
        content="RetailTrack - simple, reliable inventory and sales management for Ape Kade, Padiyathalawa." />
    <title>RetailTrack · Inventory Management</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
        try {
            const theme = localStorage.getItem('retailtrack-theme') === 'dark' ? 'dark' : 'light';
            document.documentElement.dataset.theme = theme;
            document.documentElement.style.colorScheme = theme;
        } catch { /* The light theme remains the default. */ }
    </script>
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>

</html>
